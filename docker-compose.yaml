name: fobo-metrics

services:
  postgres:
    image: postgres:17.9-alpine
    ports:
      - "5433:5432"
    volumes:
      - fobo-metrics-db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}

  redis:
    image: redis:7-alpine
    ports:
      - 6380:6379

  maildev:
    build:
      context: .
      dockerfile: maildev.Dockerfile
    ports:
      - ${MAIL_CLIENT_PORT}:1080
      - ${MAIL_PORT}:1025

  adminer:
    image: adminer
    restart: always
    ports:
      - 8180:8080

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - ${APP_PORT}:${APP_PORT}
    depends_on:
      - postgres
      - redis
    env_file:
      - .env

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: node dist/worker
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    environment:
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-2}

volumes:
  fobo-metrics-db:
